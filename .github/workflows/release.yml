name: Validate and release Android app

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Generate synthetic live media test fixtures
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          bash tools/generate-hls-fixtures.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: chmod +x gradlew
      - name: Unit tests and lint
        run: bash tools/gradle-network-retry.sh :app:testDebugUnitTest :app:lintDebug :cipher:library:testDebugUnitTest --stacktrace
      - name: Cipher tooling tests
        run: node --test cipher/tools/tools.test.mjs
      - name: Release verification tooling tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check optimized release code without signing secrets
        env:
          ANDROID_TEST_BUILD_TYPE: release
        run: bash tools/gradle-network-retry.sh :app:minifyReleaseWithR8 :app:minifyReleaseAndroidTestWithR8 --stacktrace
      - name: Build debug APK for testing
        run: bash tools/gradle-network-retry.sh :app:assembleDebug --stacktrace
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-testing-only
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
            cipher/library/build/reports/

  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            target: default
          - api-level: 34
            target: default
          - api-level: 36
            target: google_apis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Generate synthetic live media test fixtures
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          bash tools/generate-hls-fixtures.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Reserve disk space for emulator userdata
        # Only on this disposable GitHub Linux runner; Android does not use the .NET SDK.
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          # API 29 enforces a larger image minimum, so disk space is also reserved above.
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            bash tools/gradle-network-retry.sh :app:connectedDebugAndroidTest --stacktrace
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            python3 tools/capture-device.py com.indirgitsin.app.preview app/build/reports/device-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-reports-api-${{ matrix.api-level }}
          path: app/build/reports/

  preview-release:
    needs: [validate, device-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debug-testing-only
          path: apk
      - name: Prepare tested APK and checksum
        run: |
          mv apk/app-debug.apk "indir-gitsin-1.3.0-dev.${GITHUB_RUN_NUMBER}-preview.apk"
          sha256sum indir-gitsin-*.apk > SHA256SUMS.txt
      - name: Publish test prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v1.3.0-dev.${{ github.run_number }}-preview
          target_commitish: ${{ github.sha }}
          name: İndir Gitsin 1.3.0-dev.${{ github.run_number }} — Test
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Arka planda oynatma / PiP, genişletilmiş platform desteği (SoundCloud, Bandcamp vb.) ve indirme sıralama/önceliklendirme geliştirmeleri için test sürümü.

            **Kurulum:** Aşağıdaki APK'yı indirip kurun. “İndir Gitsin Test” ayrı bir uygulama olarak kurulur; mevcut uygulama ve verileri korunur.
            Bu APK debug anahtarıyla imzalanmış bir ön sürümdür. Sonraki test sürümünü yüklerken yalnızca test uygulamasını kaldırmanız gerekebilir.

            **Otomatik doğrulama:** Kotlin/JUnit ve cipher testleri, Android lint, APK imza kontrolü, Android 10, 14 ve 16 emülatörlerinde gerçek AAC/AVC birleştirme ve çözme testleri.
            **Telefonda deneyin:** 360p ve 1080p video indirin; sesin ve görüntünün tek dosyada bulunduğunu, uygulamadan çıkınca indirme durumunu ve iptali kontrol edin. Gerçek YouTube indirmesi cihazda ayrıca doğrulanmalıdır.

            Commit: ${{ github.sha }}
            Build: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            indir-gitsin-*.apk
            SHA256SUMS.txt

  signed-release:
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_TEST_BUILD_TYPE: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Generate synthetic live media test fixtures
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          bash tools/generate-hls-fixtures.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Prepare permanent distribution signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Permanent distribution signing key is required."
            exit 1
          fi
          umask 077
          RELEASE_STORE_FILE="$RUNNER_TEMP/distribution.p12"
          echo "RELEASE_STORE_FILE=$RELEASE_STORE_FILE" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
      - name: Build and check signed release
        run: |
          chmod +x gradlew
          bash tools/gradle-network-retry.sh :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease :app:assembleReleaseAndroidTest --stacktrace
      - name: Reserve disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the signed release on Android 14
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            bash tools/run-release-device-tests.sh
            curl --fail --location --retry 3 https://github.com/eekilinc/indirgitsin/releases/download/v1.1.1/indir-gitsin-1.1.1.apk --output "$RUNNER_TEMP/baseline.apk"
            echo "3959296c9d211e8d0c93b55189a83b9b36aa55dbb47b145489696c07ab71ccb5  $RUNNER_TEMP/baseline.apk" | sha256sum --check
            adb install -r -g "$RUNNER_TEMP/baseline.apk"
            python3 tools/capture-device.py com.indirgitsin.app.stable app/build/reports/baseline-evidence
            adb install -r -g app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.indirgitsin.app.stable/com.indirgitsin.app.MainActivity > app/build/reports/release-launch.txt
            cat app/build/reports/release-launch.txt
            grep -q '^Status: ok' app/build/reports/release-launch.txt
            sleep 2
            adb exec-out screencap -p > app/build/reports/release-home.png
            python3 tools/capture-device.py com.indirgitsin.app.stable app/build/reports/release-evidence
      - name: Verify permanent certificate and prepare release assets
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > certificate.txt
          cat certificate.txt
          python3 tools/verify-certificate.py certificate.txt docs/release-certificate.sha256
          python3 tools/check-native-pages.py app/build/outputs/apk/release/app-release.apk --output app/build/reports/native-pages.json
          VERSION="1.2.0-dev.${GITHUB_RUN_NUMBER}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          cp app/build/outputs/apk/release/app-release.apk "indir-gitsin-$VERSION.apk"
          python3 tools/package-source.py "indir-gitsin-$VERSION-source.zip"
          sha256sum indir-gitsin-*.apk indir-gitsin-*-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: signed-release-validation
          path: |
            app/build/reports/
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/
            app/build/outputs/mapping/releaseAndroidTest/
            app/build/outputs/apk/androidTest/release/*.apk
            app/build/outputs/androidTest-results/
            indir-gitsin-*.apk
            SHA256SUMS.txt
            indir-gitsin-*-source.zip
            certificate.txt
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RELEASE_STORE_FILE"

  release:
    needs: [validate, device-test, signed-release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-validation
      - name: Check assets from the tested signed build
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish signed final APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: İndir Gitsin ${{ github.ref_name }} — Final
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Final sürüm
            - Bağlantı girişini öne çıkaran yeni ana sayfa ve özgün indirme simgesi.
            - Kesintiden sonra doğrulanmış HTTP parçalarından devam ve etkin olmayan yarım dosyaları temizleme.
            - Android 16 hedefi, R8/kaynak küçültme, public güncelleme önbelleği ve uygulama içi gizlilik politikası.
            - Video ve ses paralel indirilir, yeniden kodlamadan tek dosyada birleştirilir.
            - 128/192/320 kbps gerçek MP3 dönüşümü ve süre sınırlı HLS canlı kayıt.
            - Canlı kaydı uygulamadan veya bildirimden durdurup MP4 olarak kaydetme.
            - Ses oynatırken çevrimdışı kapak; yeni MP3 dosyalarında gömülü kapak, başlık ve sanatçı.
            - Video için yatay tam ekran, gizlenen sistem çubukları ve konumu koruyan ekran döndürme.
            - Kapaksız ses dosyalarında müzik görünümü; oynatma hatalarında yeniden deneme.
            - GPL-3.0 lisansı ve kaynak arşivinde LAME encoder kaynakları.
            - İndirme hızı ve tahmini kalan süre gösterilir.
            - Başarısız işler yeniden denenebilir; aynı video ve kalite aktifken tekrar kuyruğa eklenmez.
            - İsteğe bağlı yalnızca tarifesiz ağ ayarı (yeni indirmeler için).
            - Dosyaları tarih/ad/boyuta göre sıralama; dosya ve geçmiş silmeden önce onay.
            - Güncelleme erişim hataları artık yanlışlıkla “güncel” gösterilmez.

            **Kurulum:** APK kalıcı anahtarla imzalanmıştır; `com.indirgitsin.app.stable` kimliği korunur. 1.1.1 final üzerine güncellenebilir; bu kurulum yolu CI'da doğrulanır. Mevcut final uygulamasını kaldırmayın.
            Tarihi/test paketlerinden ayrı kurulur; bu farklı paketlerde ayarlar ve geçmiş ayrı kalır. Önceki dosyalar telefonda korunur; Android izinleri nedeniyle hepsi otomatik görünmeyebilir.

            **Doğrulama:** Birim testleri ve lint; Android 10/14/16 üzerinde ses–görüntü birleştirme/çözme, kuyruk/yeniden deneme ve açılış testleri; imzalı final APK üzerinde Android 14 cihaz testleri; imza sertifikası doğrulaması.
            Önceki test sürümünün gerçek telefonda sesli video indirdiği kullanıcı tarafından doğrulandı. Yeni sürümün gerçek YouTube testi cihazda ayrıca yapılmalıdır.

            APK, SHA256SUMS.txt ve cipher alt modülünü içeren kaynak kod arşivi aşağıdadır. Depo ve sürümler herkese açıktır; indirmek için GitHub hesabı gerekmez.
            Doğrulanmış HTTP parçalarından devam desteklenir; dosya kimliği doğrulanamazsa güvenle baştan başlanır. 128/192/320 kbps gerçek MP3 dönüştürme ve şifresiz, birleşik ses/görüntülü HLS canlı kaydı desteklenir. Kayıt en fazla 60 dakika / 2 GiB; ayrı ses listeleri ve DRM desteklenmez.

            Commit: ${{ github.sha }}
            Build: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            indir-gitsin-*.apk
            indir-gitsin-*-source.zip
            SHA256SUMS.txt
